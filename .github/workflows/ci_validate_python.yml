name: ci_validate_python

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    # Use a matrix strategy to test across multiple environments
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Dynamically reference the operating system from the matrix
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pylint
        run: pylint src/

      - name: Run pytest
        run: pytest src/ -v
        # behave features/ is intentionally not run here: this is an active POC
        # and many scenarios are still StepNotImplementedError (spec written
        # ahead of implementation), not broken steps. Run it locally / promote
        # to CI once the feature-to-step coverage is more complete.

      - name: Run behave
        run: behave
