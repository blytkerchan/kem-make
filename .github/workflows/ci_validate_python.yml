name: ci_validate_python

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest src/ -v

      # behave features/ is intentionally not run here: this is an active POC
      # and many scenarios are still StepNotImplementedError (spec written
      # ahead of implementation), not broken steps. Run it locally / promote
      # to CI once the feature-to-step coverage is more complete.