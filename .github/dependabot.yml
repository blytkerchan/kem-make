version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # cryptography is pinned to an exact release (==49.0.0, not >=) because
      # that's the specific release line whose official PyPI wheels bundle
      # OpenSSL>=3.5, required for ML-KEM support - see pyproject.toml's
      # comment. Bumping it needs a human to re-verify PQC backend
      # availability, not an automated update.
      - dependency-name: "cryptography"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]